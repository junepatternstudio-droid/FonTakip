name: Fon Takip Güncelleme

on:
  schedule:
    - cron: "0 22 * * *"

  workflow_dispatch:


jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

    - name: Kodları indir
      uses: actions/checkout@v4


    - name: Python kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Güncelleme scriptini çalıştır
      run: |
        python update.py


    - name: Değişiklikleri kaydet
      run: |
        git config --global user.name "FonTakip Bot"
        git config --global user.email "actions@github.com"

        git add data.json

        git commit -m "Otomatik fon güncellemesi" || exit 0

        git push
