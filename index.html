<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEFAS Fon Takip Paneli</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

h1{
text-align:center;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px #ddd;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:15px;
}

th{
background:#111827;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.green{
color:green;
}

.red{
color:red;
}

.section{
margin-top:40px;
}

</style>

</head>


<body>


<div class="container">


<h1>TEFAS Fon Takip Paneli</h1>

<p id="update"></p>


<div class="cards">

<div class="card">
<h3>Günlük Net Akış</h3>
<p id="dailyNet">-</p>
</div>

<div class="card">
<h3>Haftalık Net Akış</h3>
<p id="weeklyNet">-</p>
</div>

<div class="card">
<h3>Likidite</h3>
<p id="liquidity">-</p>
</div>

</div>



<div class="section">

<h2>🟢 Günlük En Çok Para Girişi</h2>

<table>

<thead>
<tr>
<th>Sıra</th>
<th>Fon</th>
<th>Tutar</th>
</tr>
</thead>

<tbody id="dailyIn"></tbody>

</table>

</div>




<div class="section">

<h2>🔴 Günlük En Çok Para Çıkışı</h2>

<table>

<thead>
<tr>
<th>Sıra</th>
<th>Fon</th>
<th>Tutar</th>
</tr>
</thead>

<tbody id="dailyOut"></tbody>

</table>

</div>




<div class="section">

<h2>🟢 Haftalık En Çok Para Girişi</h2>

<table>

<thead>
<tr>
<th>Sıra</th>
<th>Fon</th>
<th>Tutar</th>
</tr>
</thead>

<tbody id="weeklyIn"></tbody>

</table>

</div>




<div class="section">

<h2>🔴 Haftalık En Çok Para Çıkışı</h2>

<table>

<thead>
<tr>
<th>Sıra</th>
<th>Fon</th>
<th>Tutar</th>
</tr>
</thead>

<tbody id="weeklyOut"></tbody>

</table>

</div>



</div>



<script>


fetch("data.json")

.then(res=>res.json())

.then(data=>{


document.getElementById("update").innerHTML =
"Son güncelleme: "+data.last_update;


document.getElementById("dailyNet").innerHTML =
data.market_liquidity.daily_net;


document.getElementById("weeklyNet").innerHTML =
data.market_liquidity.weekly_net;


document.getElementById("liquidity").innerHTML =
data.market_liquidity.liquidity_status;



function createRows(list){

let html="";

list.forEach(item=>{

html += `

<tr>

<td>${item.rank}</td>

<td>${item.code}</td>

<td>${item.amount}</td>

</tr>

`;

});

return html;

}



document.getElementById("dailyIn").innerHTML =
createRows(data.daily_top_inflow);


document.getElementById("dailyOut").innerHTML =
createRows(data.daily_top_outflow);


document.getElementById("weeklyIn").innerHTML =
createRows(data.weekly_top_inflow);


document.getElementById("weeklyOut").innerHTML =
createRows(data.weekly_top_outflow);



});


</script>


</body>

</html>
