<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEFAS Fon Takip Paneli</title>

<style>

body {
    font-family: Arial, sans-serif;
    background:#f3f4f6;
    padding:20px;
}

.container {
    max-width:1200px;
    margin:auto;
}

h1 {
    text-align:center;
}

.card-area {
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    justify-content:center;
}

.card {
    background:white;
    padding:20px;
    border-radius:12px;
    min-width:220px;
    box-shadow:0 2px 8px #ddd;
}

table {
    width:100%;
    background:white;
    border-collapse:collapse;
    margin-top:20px;
}

th {
    background:#111827;
    color:white;
    padding:10px;
}

td {
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

.section {
    margin-top:40px;
}

</style>

</head>


<body>


<div class="container">


<h1>TEFAS Fon Takip Paneli</h1>

<p id="update"></p>


<div class="card-area">


<div class="card">
<h3>Günlük Giriş</h3>
<p id="dailyIn">-</p>
</div>


<div class="card">
<h3>Günlük Çıkış</h3>
<p id="dailyOut">-</p>
</div>


<div class="card">
<h3>Haftalık Giriş</h3>
<p id="weeklyIn">-</p>
</div>


<div class="card">
<h3>Net Akış</h3>
<p id="netFlow">-</p>
</div>


</div>



<div class="section">

<h2>Fon Listesi</h2>


<table>

<thead>

<tr>

<th>Fon</th>
<th>Tür</th>
<th>Günlük Giriş</th>
<th>Günlük Çıkış</th>
<th>Net Akış</th>

</tr>

</thead>


<tbody id="fundTable">

</tbody>


</table>


</div>


</div>



<script>


fetch("data.json")

.then(response => response.json())

.then(data => {


document.getElementById("update").innerHTML =
"Son Güncelleme: " + data.last_update;


document.getElementById("dailyIn").innerHTML =
data.market_liquidity.daily_inflow;


document.getElementById("dailyOut").innerHTML =
data.market_liquidity.daily_outflow;


document.getElementById("weeklyIn").innerHTML =
data.market_liquidity.weekly_inflow;


document.getElementById("netFlow").innerHTML =
data.market_liquidity.net_flow;



let table = "";


data.funds.forEach(fund => {


table += `

<tr>

<td>${fund.code}</td>

<td>${fund.type}</td>

<td>${fund.daily_inflow}</td>

<td>${fund.daily_outflow}</td>

<td>${fund.net_flow}</td>


</tr>


`;


});


document.getElementById("fundTable").innerHTML = table;


});


</script>


</body>

</html>
