<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fon Radar Paneli</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f4f6f8;
padding:20px;
}

.container{
max-width:1500px;
margin:auto;
}

h1{
text-align:center;
}

.info{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:20px;
}

th{
background:#1f2937;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

</style>

</head>


<body>


<div class="container">


<h1>📊 Fon Radar Paneli</h1>


<div class="info">

<p id="update"></p>

<p id="status"></p>

</div>



<h2>⭐ Fon Listesi</h2>


<table>


<thead>

<tr>

<th>Fon Kodu</th>

<th>Fon Adı</th>

<th>Fiyat</th>

<th>Tarih</th>

<th>Günlük Getiri</th>

<th>Haftalık Getiri</th>

<th>Aylık Getiri</th>

<th>Günlük Para Akışı</th>

<th>Haftalık Para Akışı</th>

<th>Yatırımcı Değişimi</th>

</tr>

</thead>


<tbody id="fundTable">

</tbody>


</table>



</div>




<script>


fetch("data.json")


.then(response => response.json())


.then(data => {


document.getElementById("update").innerHTML =
"Son güncelleme: " + data.last_update;


document.getElementById("status").innerHTML =
"TEFAS bağlantısı: " +
data.tefas_status.connection +
" | Fon sayısı: " +
data.tefas_status.fund_count;



let html="";


data.funds.slice(0,100).forEach(fund => {


html += `


<tr>

<td>${fund.code}</td>

<td>${fund.name}</td>

<td>${fund.price}</td>

<td>${fund.date}</td>

<td>${fund.daily_return}%</td>

<td>${fund.weekly_return}%</td>

<td>${fund.monthly_return}%</td>

<td>${fund.daily_inflow}</td>

<td>${fund.weekly_inflow}</td>

<td>${fund.investor_change}</td>


</tr>


`;

});


document.getElementById("fundTable").innerHTML = html;



})

.catch(error=>{

document.getElementById("fundTable").innerHTML =
"Veri yüklenemedi";

});



</script>


</body>

</html>
